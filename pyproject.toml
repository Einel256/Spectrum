[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spectrum-tui"
version = "1.0.0"
description = "ANSI 256-color terminal audio visualizer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
spectrum = "spectrum:main"

[tool.setuptools]
py-modules = ["spectrum"]
